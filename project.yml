name: GardenApp
options:
  bundleIdPrefix: com.tomasrojder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  GardenApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GardenApp
    entitlements:
      path: GardenApp/App/GardenApp.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tomasrojder.gardenapp
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: GardenApp/Generated-Info.plist
      properties:
        CFBundleDisplayName: Garden
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.tomasrojder.gardenapp.frostcheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomasrojder.gardenapp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""

  GardenAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GardenAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomasrojder.gardenapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GardenApp
    dependencies:
      - target: GardenApp

schemes:
  GardenApp:
    build:
      targets:
        GardenApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GardenAppUITests
